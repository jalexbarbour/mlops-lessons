<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mlops-lessons</title>
<meta name="description" content="MLOps exercises run locally on a 16GB Apple Silicon MacBook Air.">
<style>
  :root {
    color-scheme: light;
    --plane:          #f9f9f7;
    --surface-1:      #fcfcfb;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --border:         rgba(11,11,11,0.10);
    --series-1:       #2a78d6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --plane:          #0d0d0d;
      --surface-1:      #1a1a19;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --border:         rgba(255,255,255,0.10);
      --series-1:       #3987e5;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--plane);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.55;
  }
  a { color: var(--series-1); }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 24px 96px; }

  header {
    padding: 64px 0 40px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 40px;
  }
  .eyebrow {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin: 0 0 12px;
  }
  h1 {
    font-size: clamp(28px, 4.5vw, 40px);
    margin: 0 0 14px;
    letter-spacing: -0.01em;
  }
  .lede {
    font-size: 18px;
    color: var(--text-secondary);
    max-width: 60ch;
    margin: 0;
  }

  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); margin: 0 0 16px; }

  .labs { display: flex; flex-direction: column; gap: 1px; background: var(--gridline); border: 1px solid var(--gridline); border-radius: 12px; overflow: hidden; }
  .lab-card { background: var(--surface-1); padding: 20px 24px; display: block; text-decoration: none; color: inherit; }
  .lab-card:hover { background: var(--plane); }
  .lab-name { font-size: 17px; font-weight: 600; margin: 0 0 6px; color: var(--text-primary); }
  .lab-desc { font-size: 14px; color: var(--text-secondary); margin: 0; }
  .lab-card .arrow { color: var(--text-muted); float: right; }

  footer {
    margin-top: 72px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 13px;
  }
  footer a { color: var(--text-muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">MLOps · Local exercises</p>
    <h1>mlops-lessons</h1>
    <p class="lede">
      Hands-on exercises learning MLOps and the tooling around it, run
      entirely on a 16&nbsp;GB Apple Silicon MacBook Air. Each lesson below
      is a self-contained project with its own writeup.
    </p>
  </header>

  <section>
    <h2>Lessons</h2>
    <div class="labs">
      <!--LABS-->
    </div>
  </section>

  <footer>
    <a href="https://github.com/jalexbarbour/mlops-lessons">github.com/jalexbarbour/mlops-lessons</a>
  </footer>
</div>
</body>
</html>
